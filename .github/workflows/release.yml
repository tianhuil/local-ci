name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # pnpm/action-setup v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: release
        run: node scripts/release.mts publish
        env:
          GH_TOKEN: ${{ github.token }}

  # Install the release the way users would, from a clean runner.
  verify-install:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        how:
          [
            npm-global,
            pnpm-dev,
            npm-dev,
            pnpm-global,
            bun-global,
            yarn1-global,
            npx,
            pnpm-dlx,
            bunx,
          ]
        ref: [tag, release]
    env:
      SPEC: github:${{ github.repository }}#${{ matrix.ref == 'tag' && needs.release.outputs.tag || 'release' }}
      BIN: local-ci
    steps:
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      # pnpm/action-setup v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install and run
        run: |
          set -euo pipefail
          export PNPM_HOME="$RUNNER_TEMP/pnpm" PATH="$RUNNER_TEMP/pnpm:$HOME/.bun/bin:$PATH"
          case "${{ matrix.how }}" in
            npm-global)   npm install -g "$SPEC";  out=$("$BIN" --version) ;;
            pnpm-global)  pnpm add -g "$SPEC";     out=$("$BIN" --version) ;;
            bun-global)   bun add -g "$SPEC";      out=$("$BIN" --version) ;;
            yarn1-global) npm install -g yarn@1; yarn global add "$SPEC"; out=$("$(yarn global bin)/$BIN" --version) ;;
            pnpm-dev)     cd "$(mktemp -d)"; npm init -y >/dev/null; pnpm add -D "$SPEC"; out=$(pnpm exec "$BIN" --version) ;;
            npm-dev)      cd "$(mktemp -d)"; npm init -y >/dev/null; npm install -D "$SPEC"; out=$(npx --no-install "$BIN" --version) ;;
            npx)          out=$(npx --yes "$SPEC" --version) ;;
            pnpm-dlx)     out=$(pnpm dlx "$SPEC" --version) ;;
            bunx)         out=$(bunx "$SPEC" --version) ;;
          esac
          want="${{ needs.release.outputs.tag }}"; want="${want#v}"
          echo "got: $out, want: $want"
          test "$(echo "$out" | tail -n1)" = "$want"
